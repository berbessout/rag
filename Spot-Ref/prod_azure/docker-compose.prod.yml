# Production Docker Compose for Azure Container Apps
# This file is for reference - individual containers will be deployed separately on Azure

version: '3.8'

services:
  # Production Chainlit Application
  chainlit-prod:
    build:
      context: ..
      dockerfile: prod_azure/Dockerfile.chainlit.prod
    container_name: chainlit_prod
    environment:
      - PYTHONPATH=/app
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt4o}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
      - AZURE_FINAL_MODEL_DEPLOYMENT=${AZURE_FINAL_MODEL_DEPLOYMENT:-gpt-4.1-mini}
      - AZURE_AGENT_DEPLOYMENT=${AZURE_AGENT_DEPLOYMENT:-gpt-4o}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-2023-05-15}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-spot-ref-docs}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
    ports:
      - "8000:8000"
    depends_on:
      - qdrant-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Production Ingestion Application  
  ingestion-prod:
    build:
      context: ..
      dockerfile: prod_azure/Dockerfile.ingestion.prod
    container_name: ingestion_prod
    environment:
      - PYTHONPATH=/app
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt4o}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-2023-05-15}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-spot-ref-docs}
      - SHAREPOINT_SITE_URL=${SHAREPOINT_SITE_URL}
      - SHAREPOINT_USERNAME=${SHAREPOINT_USERNAME}
      - SHAREPOINT_PASSWORD=${SHAREPOINT_PASSWORD}
      - SHAREPOINT_LIBRARY_NAME=${SHAREPOINT_LIBRARY_NAME}
      - INGESTION_MODE=${INGESTION_MODE:-5}
      - BATCH_SIZE=${BATCH_SIZE:-64}
      - DATA_DIR=${DATA_DIR:-Customer_txt}
      - DOWNLOAD_WORKERS=${DOWNLOAD_WORKERS:-10}
      - CONVERSION_WORKERS=${CONVERSION_WORKERS:-10}
      - TRANSLATION_WORKERS=${TRANSLATION_WORKERS:-10}
      - SPLITTING_WORKERS=${SPLITTING_WORKERS:-10}
      - EMBEDDING_WORKERS=${EMBEDDING_WORKERS:-10}
      - MAX_MEMORY_GB=${MAX_MEMORY_GB:-4.0}
      - RETRY_MAX_ATTEMPTS=${RETRY_MAX_ATTEMPTS:-3}
      - RETRY_BACKOFF_FACTOR=${RETRY_BACKOFF_FACTOR:-2.0}
      - RETRY_INITIAL_DELAY=${RETRY_INITIAL_DELAY:-1.0}
      - RETRY_MAX_DELAY=${RETRY_MAX_DELAY:-60.0}
      - API_RATE_LIMIT_OPENAI=${API_RATE_LIMIT_OPENAI:-10}
      - API_RATE_LIMIT_SP=${API_RATE_LIMIT_SP:-50}
      - ENABLE_PROGRESS_TRACKING=${ENABLE_PROGRESS_TRACKING:-true}
    depends_on:
      - qdrant-prod
    restart: "no"  # Runs once then stops
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # Production Qdrant Vector Database
  qdrant-prod:
    build:
      context: ..
      dockerfile: prod_azure/Dockerfile.qdrant.prod
    container_name: qdrant_prod
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  qdrant_storage:
    driver: local

networks:
  default:
    name: spot-ref-network 